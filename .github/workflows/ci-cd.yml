name: CI/CD Pipeline

# Controls when the workflow will run
on:
  # Run on pushes to main and develop branches
  push:
    branches: [ main, develop ]

  # Run on pull requests targeting main or develop
  pull_request:
    branches: [ main, develop ]

  # Allow manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  # ==============================================
  # JOB 1: Run Tests
  # ==============================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 🔬 Run Tests
        run: |
          PYTHONPATH=$GITHUB_WORKSPACE:$PYTHONPATH pytest tests/ -v --tb=short

  # ==============================================
  # JOB 2: Build and Push Docker Image
  # ==============================================
  build-and-push:
    name: 🐳 Build & Push Docker Image
    needs: test  # Only runs if test job succeeds
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/netops-hub:latest
            ${{ secrets.DOCKER_USERNAME }}/netops-hub:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.sha }}